#warm.go .flash {

}
@keyframes pw-flash {
0% {
opacity: 0;
}
50% {

}
100% {
opacity: 0;
}
}
/* v7 L — power-OFF mirrors the power-on on the SAME element: the lit
raster squeezes vertically into the bright line (scaleY), the line shrinks
horizontally to the dot (scaleX, same .dot), the dot fades as phosphor
afterglow. Transform/opacity only (the old filter:brightness collapse is
gone), 240+200+480 = 920 ms ≤ the old 1120 ms. */
#warm.go.cool .dot {
animation: pw-cool 920ms linear both;
}
@keyframes pw-cool {
0% {
transform: translate(-50%, -50%) scale(90, 60);
opacity: 0.4;
animation-timing-function: cubic-bezier(0.45, 0, 0.55, 1);
}
26.087% {
transform: translate(-50%, -50%) scale(90, 1);
opacity: 1;
animation-timing-function: cubic-bezier(0.2, 0.8, 0.2, 1);
}
47.826% {
transform: translate(-50%, -50%) scale(1, 1);
opacity: 1;
animation-timing-function: cubic-bezier(0.4, 0, 0.6, 1);
}
100% {
transform: translate(-50%, -50%) scale(0.5);
opacity: 0;
}
}
/* the line is the brightest beat: a static white radial whose opacity
rises into the squeeze and dies with the line (no filter:brightness) */
#warm.go.cool .flash {
animation: pw-coolflash 460ms ease-in-out both;
}
@keyframes pw-coolflash {
0% {
opacity: 0.16;
}
26% {
opacity: 0.26;
}
62% {
opacity: 0;
}
100% {
opacity: 0;
}
}
}

/* ============================== CRT CONTENT ============================== */
.crt {

/* review #3: hidden views stay out of the a11y tree (visibility, not opacity) */
.crtview {
position: absolute;
inset: 0;
opacity: 0;
pointer-events: none;
visibility: hidden;
transition:
opacity 0.32s ease,
visibility 0s linear 0.32s;
}
.crtview.live {
opacity: 1;
pointer-events: auto;
visibility: visible;
transition:
opacity 0.32s ease,
visibility 0s;
}
/* I4: at collapse start the views are hidden WITHOUT a transition and stay
hidden until the next power-on — the 250 ms visibility delay (H #3) must
not re-show the archive screen after the collapse begins */
body.poff-hide .crtview {

}

/* #10: no dimming on the hint — the bar colour itself is now legible */
/* ============================== OBJECTS ============================== */
.objs {

/* v7 G1 (item 5): the focus ring FOLLOWS THE DISK SHAPE — a box-shadow with
the floppy's own 7 px radius (the outline was a detached rectangle) */

/* v7 G1 (item 4): hover = a physical lift, no outline */
@media (prefers-reduced-motion: no-preference) {

.obj.opening {

pointer-events: none;

/* v7 G2 (item 9): phosphor persistence — the outgoing view's afterglow:
the incoming view appears at once, the outgoing one fades 1→0 in 320 ms,
pointer-events none (it never blocks input) */
.view-ghost {
position: absolute;
pointer-events: none;
z-index: 0;
will-change: opacity;
}
/* v7 N1: the ghost is BELOW the live layer — the opaque live disks cover
it, so the afterglow only shows in empty space (never "the same disk
twice" over a real disk) */
.view-ghost .obj-wrap {
animation: none !important;
}
.view-ghost .obj {

rgba(255, 255, 255, 0.1) 0 1px,
rgba(0, 0, 0, 0.1) 1px 2px,
transparent 2px 3px

overflow: hidden;
white-space: nowrap;
display: block; /* v6 E (#2): NEVER wraps — fitLabels() shrinks instead */
}
/* 1-bit label: big scene box + title (P6) */
.lic {
flex: none;
width: 64px;
height: 64px;
display: inline-flex;
color: var(--label-ink);
}
.lic svg {
display: block;
width: 100%;
height: 100%;
overflow: visible;
}
/* review #11: the 1.25× overshoot is motion — only for users who want it */
@media (prefers-reduced-motion: no-preference) {
.lic {
transition: transform 0.28s cubic-bezier(0.2, 0.9, 0.3, 1.4);
}
.obj:hover .lic,
.obj:focus-visible .lic {
transform: scale(1.25);
}
}
.f-txt {
min-width: 0;
flex: 1;
display: flex;
flex-direction: column;
align-items: center;
justify-content: flex-start;
}
.f-sub {
position: absolute;
bottom: 3px;
left: 0;
right: 0;
text-align: center;
font-size: 11px;
letter-spacing: 2px;
color: #7d7256;
}
.obj-item .f-sub {
display: none;
}
/* ---------- plain list (v7 G1 item 6: phosphor type, dotted leaders) ---------- */
.plain {
width: 70%;
max-width: 880px;
margin: 0 auto;
flex: 1;
display: flex;
flex-direction: column;
gap: 6px;
justify-content: center;
}
.plain h3 {
font-family: var(--f-sans);
font-weight: 600;
font-size: 22px;
letter-spacing: 3px;
color: var(--phos-dim);
margin: 14px 0 10px;
text-transform: uppercase;
}
.plain-row {
font-family: var(--f-phos);
font-size: 32px;
color: var(--phos-hi);
background: transparent;
border: 1px solid transparent;
border-left: 2px solid var(--phos-faint);
padding: 8px 16px;
cursor: pointer;
text-align: left;
display: flex;
gap: 12px;
align-items: baseline;
min-height: 64px;
width: 100%;
}
.plain-row:hover {
background: rgba(91, 232, 135, 0.07);
border-left-color: var(--phos);
outline: 2px solid var(--phos-hi);
outline-offset: 2px;
}
.plain-row:focus-visible {
outline: 2px solid var(--phos-hi);
outline-offset: 2px;
}
.plain-row .pr-name {
font-weight: normal;
}
.plain-row .pr-leader {
flex: 1;
border-bottom: 1px dotted rgba(91, 232, 135, 0.35);
height: 1px;
align-self: center;
transform: translateY(-0.1em);
min-width: 12px;
}
.plain-row .pr-meta {
color: #3f9a5f;
font-size: 22px;
margin-left: auto;
text-align: right;
letter-spacing: 1px;
}
.plain-row .pr-arrow {
color: var(--phos-dim);
}
.glass.amber .plain-row .pr-meta {
color: #c99243;
}
.glass.amber .plain-row .pr-leader {
border-bottom-color: rgba(242, 178, 74, 0.35);
}
/* ============================== PLACARD (description card) ============================== */
.card {
position: absolute;
z-index: 40;
width: min(340px, calc(100% - 16px));
background: var(--card-bg);
border: 1px solid var(--card-edge);
border-radius: 8px;
box-shadow:
0 14px 34px rgba(0, 0, 0, 0.6),
0 0 0 4px rgba(6, 14, 9, 0.55);
padding: 7px 12px 6px;
font-family: var(--f-sans);
color: var(--card-ink);
/* P8: fixed compact layout, NO scroll — header, one tags row, 2-line
clamped desc, footer pinned at the bottom; worst case ~180px so it
fits above (191px) / below (209px) the middle row */
display: flex;
flex-direction: column;
min-height: 150px;
}
.card[hidden] {
display: none;
}
.card::after {
content: "";
position: absolute;
width: 12px;
height: 12px;
background: var(--card-bg);
border: 1px solid var(--card-edge);
transform: translateX(-50%) rotate(45deg);
left: var(--px, 50%);
bottom: -7px;
}
/* F1: bottom sheet — a card must never cover a disk; pinned to the glass
bottom (above the status bar), full glass width, no pointer arrow */
.card.sheet::after {
display: none;
}
.card.below::after {
bottom: auto;
top: -7px;
}
.card.mode-left::after {
left: auto;
right: -7px;
bottom: auto;
top: var(--py, 50%);
}
.card.mode-right::after {
left: -7px;
bottom: auto;
top: var(--py, 50%);
}
.card-t {
font-family: var(--f-phos);
font-size: 28px;
font-weight: 400;
line-height: 1.02;
overflow-wrap: anywhere;
padding-right: 34px;
display: -webkit-box;
-webkit-line-clamp: 2;
-webkit-box-orient: vertical;
overflow: hidden;
}
/* v7 G1 (item 7): long titles (>25 chars) step down to 24 px, still 2-line clamped */
.card-t.long {
font-size: 24px;
}
.card-p {
margin-top: 2px;
font-family: var(--f-phos);
font-size: 20px;
font-weight: 400;
line-height: 1.12;
letter-spacing: 1px;
color: #3f9a5f;
text-transform: uppercase;
/* F2: wrap to 2 lines before any ellipsis — never cut mid-word
(the old nowrap+ellipsis cut "SOFTWARE ENG…") */
display: -webkit-box;
-webkit-line-clamp: 2;
-webkit-box-orient: vertical;
overflow: hidden;
}
/* v7 G1b nit: the meta wraps at SEGMENT boundaries — each chunk is one
segment plus its trailing " ·", so a separator never starts a line (it
stays at the end of line 1, or the chunk breaks as a whole) */
.card-p .mps,
.dt-meta .mps,
.dt-stack .mps {
display: inline-block;
white-space: nowrap;
}
.glass.amber .card-p {
color: #c99243;
}
/* v7 G1 (item 7): no synthetic weights on buttons and links */
button,
a {
font-synthesis: none;
}
/* reviewer (d): tags must never be cut mid-word — they WRAP to a 2nd line
(each chip keeps its whole width; nothing ellipsizes or clips). */
.card-tags {
display: flex;
flex-wrap: wrap;
gap: 5px;
margin-top: 4px;
position: relative;
}
.glass.amber .dt-meta,
.glass.amber .dt-sec,
.glass.amber .dt-stack {
color: #d9b36a;
}
.glass.amber .dt-line::before,
.glass.amber .dt-links {
border-color: #8a6a3a;
}
.glass.amber .dt-line::before {
color: #8a6a3a;
}
.card-tags span {
flex: none;
font-size: 13px;
font-weight: 500;
letter-spacing: 0.4px;
white-space: nowrap;
color: var(--card-dim);
border: 1px solid var(--card-line);
border-radius: 3px;
padding: 0 7px;
}
.card-d {
margin-top: 4px;
font-size: 14.5px;
line-height: 1.28;
color: #c8d6cc;
display: -webkit-box;
-webkit-line-clamp: 2;
-webkit-box-orient: vertical;
overflow: hidden;
}
.card-l {
display: inline-block;
margin-top: 8px;
font-size: 12.5px;
font-weight: 600;
letter-spacing: 0.4px;
color: var(--phos);
text-decoration: none;
border-bottom: 1px solid var(--phos-dim);
}
.card-l:hover {
color: var(--phos-hi);
border-color: var(--phos-hi);
}
.card-l:focus-visible {
outline: 2px solid var(--phos);
outline-offset: 2px;
}
.card-l.dim {
color: var(--card-dim);
border-color: var(--card-line);
cursor: default;
}
.card-x {
position: absolute;
top: 6px;
right: 6px;
width: 26px;
height: 26px;
background: transparent;
border: 0;
color: var(--card-dim);
font-size: 15px;
cursor: pointer;
border-radius: 4px;
line-height: 1;
}
.card-x:hover {
color: var(--card-ink);
background: rgba(255, 255, 255, 0.06);
}
.card-x:focus-visible {
outline: 2px solid var(--phos);
outline-offset: 1px;
}
/* card footer: VIEW MORE bottom-left; on the right OPEN CV + REPO side by
side on ONE line (identical mono type), thin divider, no second line ever.
P8: pinned at the bottom (margin-top:auto), never scrolled away */
.card-actions {
display: flex;
justify-content: space-between;
align-items: center;
gap: 8px;
margin-top: auto;
padding-top: 4px;
flex-wrap: nowrap;
}
.card-actions .card-more,
.card-actions .card-l {
font-family: var(--f-phos);
font-size: 15px;
font-weight: 600;
letter-spacing: 1px;
line-height: 1;
min-height: 26px;
display: inline-flex;
align-items: center;
white-space: nowrap;
}
.card-actions .card-l {
margin-top: 0;
padding: 0 1px;
text-decoration: none;
}
.card-right {
display: flex;
align-items: center;
gap: 10px;
flex: none;
}
.card-sep {
width: 1px;
height: 14px;
background: var(--card-line);
flex: none;
}
.card-more {
color: var(--phos);
background: rgba(91, 232, 135, 0.08);
border: 1px solid var(--phos-dim);
border-radius: 4px;
padding: 0 10px;
cursor: pointer;
}
.card-more:hover {
border-color: var(--phos);
background: rgba(91, 232, 135, 0.16);
}
.card-more:focus-visible {
outline: 2px solid var(--phos);
outline-offset: 2px;
}
/* ============================== DETAIL VIEW (inside the glass) ============================== */
/* v7 M1: flex column — without it .dt-scroll's flex:1 never constrained */
#detailView {
z-index: 30;
display: flex;
flex-direction: column;
background: radial-gradient(
90% 90% at 50% 40%,
var(--phos-bg-1) 0%,
var(--phos-bg-2) 62%,
var(--phos-bg-3) 100%
);
}
.glass.amber #detailView {
background: radial-gradient(90% 90% at 50% 40%, #2b1f0c 0%, #170f05 62%, #0a0603 100%);
}
.dt-scroll {
flex: 1;
overflow-y: auto;
overscroll-behavior: contain;
}
/* v7 N8: "more below" hint — a bottom fade that shows ONLY while content
remains under the fold; toggled from a passive, rAF-throttled scroll
listener (no layout thrash) */
.dt-fade {
position: sticky;
bottom: 0;
height: 52px;
margin-top: -52px;
pointer-events: none;
opacity: 0;
transition: opacity 0.25s ease;
background: linear-gradient(180deg, rgba(2, 9, 5, 0) 0%, var(--phos-bg-3) 90%);
}
.glass.amber .dt-fade {
background: linear-gradient(180deg, rgba(10, 6, 3, 0) 0%, #0a0603 90%);
}
.dt-scroll.morescroll .dt-fade {
opacity: 1;
}
.dt-body {
padding: 16px 20px 24px;
max-width: 1100px; /* v6 E (#8): 22 px body, wider column */
font-family: var(--f-phos);
font-size: 22px;
line-height: 1.4;
color: var(--phos);
text-shadow: 0 0 7px rgba(91, 232, 135, 0.4);
}
.dt-title {
font-size: 1.35em;
color: var(--phos-hi);
text-shadow: 0 0 10px rgba(157, 255, 192, 0.5);
}
.dt-meta {
margin-top: 2px;
font-size: 0.85em;
color: var(--phos-sec);
letter-spacing: 1px;
text-transform: uppercase;
} /* v7 N9b: caps, like the card */
/* v7 N6: the title must clearly outrank the summary — ~1.1 em, one shade
dimmer than the title's hi-green (the M 1.25×/hi-green left them near-equal) */
.dt-sum {
margin-top: 10px;
font-size: 1.1em;
line-height: 1.25;
color: var(--phos);
text-shadow: 0 0 8px rgba(157, 255, 192, 0.3);
}
/* M-review: 1.25× took 5 lines on the phone — ~1.08× on the phone stage */
body.st-phone .dt-sum {
font-size: 1.08em;
}
.dt-sec {
margin-top: 18px;
margin-bottom: 4px;
font-size: 0.78em;
letter-spacing: 3px;
color: var(--phos-sec);
}
.dt-line {
margin-top: 10px;
padding-left: 16px;
position: relative;
}
.dt-line::before {
content: "▸";
position: absolute;
left: 0;
color: var(--phos-sec);
}
.dt-links {
margin-top: 20px;
padding-top: 12px;
border-top: 1px dotted var(--phos-sec);
display: flex;
gap: 18px;
align-items: baseline;
flex-wrap: wrap;
}
.dt-stack {
font-size: 0.8em;
letter-spacing: 2px;
color: var(--phos-sec);
line-height: 1.6;
}
.dt-linkrow {
display: inline-flex;
gap: 18px;
margin-left: auto;
}
.dt-linkrow a {
font-size: 1.05em;
min-height: 40px;
display: inline-flex;
align-items: center;
padding: 0 2px;
}
/* ============================== BEZEL FOOT ============================== */
.crt-bottom {
display: flex;
align-items: center;
gap: 14px;
margin: 10px 2px 0;
padding: 7px 14px;
border-radius: 10px; /* v6 E (O5): compact, lower bottom control bar */
background: linear-gradient(180deg, #c2b191 0%, #a48f6c 100%);
box-shadow:
inset 0 2px 5px rgba(58, 44, 20, 0.45),
0 1px 0 rgba(255, 255, 255, 0.35);
}
.vents {
flex: 1;
min-width: 120px;
height: 14px;
border-radius: 2px; /* reviewer (c): freed width goes to the grille; v6 E (O5): lower */
background: repeating-linear-gradient(0deg, rgba(50, 38, 18, 0.65) 0 2px, rgba(50, 38, 18, 0) 2px 6px);
box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.35);
}
/* 3.5" disk inserter slot in the case's bottom strip */
.ds-in {
flex: none;
display: flex;
align-items: center;
gap: 8px;
padding: 6px 12px;
border-radius: 3px;
background: rgba(60, 48, 24, 0.22);
box-shadow:
inset 0 1px 3px rgba(0, 0, 0, 0.35),
0 1px 0 rgba(255, 255, 255, 0.4);
}
.ds-in-m {
display: none;
}
.ds-slot {
width: var(--slot);
height: 9px;
border-radius: 2px;
background: #100e0c;
position: relative;
box-shadow:
inset 0 2px 4px rgba(0, 0, 0, 0.9),
0 1px 0 rgba(255, 255, 255, 0.45);
}
.ds-slot::before {
/* slot lip */
content: "";
position: absolute;
left: 2px;
right: 2px;
top: 1px;
height: 2px;
border-radius: 1px;
background: rgba(255, 255, 255, 0.1);
}
.ds-led {
width: 6px;
height: 6px;
border-radius: 50%;
background: #241a10;
flex: none;
box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.7);
}
/* v7 G2 (item 13): the insert clip — its bottom edge sits at the slot
mid-line, so the disk visibly SINKS behind the lip instead of fading.
translateZ(0) makes fixed children clip against it. */
.disk-sink {
position: fixed;
overflow: hidden;
pointer-events: none;
z-index: 199;
transform: translateZ(0);
}
/* v7 G2 (item 13): slot-lip highlight flash (120 ms at flight offset .9) */
.ds-lip {
position: absolute;
left: 1px;
right: 1px;
top: 0;
height: 100%;
border-radius: 2px;
opacity: 0;
pointer-events: none;
background: linear-gradient(
90deg,
transparent,
rgba(150, 255, 190, 0.5) 15%,
rgba(220, 255, 235, 0.8) 50%,
rgba(150, 255, 190, 0.5) 85%,
transparent
);
}
.ds-in.busy .ds-led {
box-shadow: 0 0 9px rgba(102, 242, 154, 0.9);
}
@media (prefers-reduced-motion: no-preference) {
.ds-in.busy .ds-led {
background: #66f29a;
animation: dsled 0.15s steps(1) 6;
}
@keyframes dsled {
50% {
background: #173524;
}
}
}
/* ---- label icons: animated ONLY while their disk is hovered/focused;
off-hover the animation is removed, so every icon resets to frame one.
P10 — big readable scenes: one body family (see _fig/_limb kit in JS);
every loop 0.9-1.6s, eased, ENDS WHERE IT BEGINS, with a CLEARLY VISIBLE
amplitude (arms rotate 25-40°, props travel >=15% of the box) and the
active part of the motion taking ~60% of the loop. The static
(reduced-motion) frame is each scene's key pose. ---- */
/* — human-figure motions — */
@keyframes liWave {
0%,
100% {
transform: rotate(-20deg);
}
50% {
transform: rotate(20deg);
}
}
@keyframes liSteam {
0%,
100% {
opacity: 0.55;
transform: translateY(1.4px);
}
40% {
opacity: 0.95;
transform: translateY(-1.6px);
}
80% {
opacity: 0.15;
transform: translateY(-4.6px);
}
}
@keyframes liType {
0%,
100% {
transform: translateY(0);
}
25%,
75% {
transform: translateY(-1px);
}
}
@keyframes liPoint {
0%,
100% {
transform: rotate(0);
}
50% {
transform: rotate(-14deg);
}
}
@keyframes liBlink {
0%,
40% {
opacity: 1;
}
55%,
90% {
opacity: 0.12;
}
100% {
opacity: 1;
}
}
/* v7 L: army = access pictogram — ✕ (blocked) spins out, ✓ (approved)
spins in and holds, then back; one 45°-step flip, transform/opacity only,
the loop ends on its first frame. */
/* v7 N7: the hover plays ONCE (~0.45 s, forwards) and HOLDS the ✓ while
hovered/focused; on leave the animation drops and the ✕ reverts. The old
1.4 s loop showed the ✓ for only ~300 ms per cycle. */
.obj:hover .li-cross,
.obj:focus-visible .li-cross {
animation: liCross 0.45s ease-in forwards;
}
.obj:hover .li-tick,
.obj:focus-visible .li-tick {
animation: liTickIn 0.45s ease-out forwards;
}
@keyframes liCross {
0% {
opacity: 1;
transform: rotate(0) scale(1);
}
55%,
100% {
opacity: 0;
transform: rotate(90deg) scale(0.55);
}
}
@keyframes liTickIn {
0% {
opacity: 0;
transform: rotate(-90deg) scale(0.55);
}
60% {
opacity: 1;
transform: rotate(0) scale(1.14);
}
100% {
opacity: 1;
transform: rotate(0) scale(1);
}
}
@keyframes liCap {
0%,
100% {
transform: rotate(0) translateY(0);
}
45% {
transform: rotate(-9deg) translateY(-1.4px);
}
}
@keyframes liPage {
0%,
20% {
opacity: 1;
transform: scaleX(1);
}
45%,
55% {
opacity: 0;
transform: scaleX(0.12);
}
80%,
100% {
opacity: 1;
transform: scaleX(1);
}
}
@keyframes liShelve {
0%,
100% {
transform: rotate(0);
}
45%,
60% {
transform: rotate(34deg);
}
}
@keyframes liMag {
0%,
100% {
transform: translate(0, 0);
}
50% {
transform: translate(-3.4px, 1.4px);
}
}
@keyframes liFound {
0%,
40% {
opacity: 0;
}
55%,
80% {
opacity: 1;
}
95%,
100% {
opacity: 0;
}
}
@keyframes liBeat {
0% {
stroke-dashoffset: 100;
}
50% {
stroke-dashoffset: 0;
}
100% {
stroke-dashoffset: -100;
}
}
@keyframes liPump {
0%,
48%,
100% {
transform: translateY(0);
}
8% {
transform: translateY(-3px);
}
16% {
transform: translateY(0);
}
24% {
transform: translateY(-3px);
}
32% {
transform: translateY(0);
}
40% {
transform: translateY(-2px);
}
}
/* — prop motions — */
@keyframes liSpin {
to {
transform: rotate(360deg);
}
}
@keyframes liLift {
0%,
100% {
transform: translateY(0) rotate(0);
}
40% {
transform: translateY(2.4px) rotate(-3deg);
}
70% {
transform: translateY(0.6px);
}
}
@keyframes liFlame {
from {
transform: scaleY(1);
}
to {
transform: scaleY(0.45);
}
}
@keyframes liStamp {
0%,
10% {
transform: translateY(-4px);
opacity: 0;
}
34% {
transform: translateY(0);
opacity: 1;
}
46% {
transform: translateY(0.8px);
}
58%,
84% {
transform: translateY(0);
opacity: 1;
}
100% {
transform: translateY(0);
opacity: 0;
}
}
@keyframes liTok {
0%,
8% {
transform: translateY(0);
opacity: 0;
}
18% {
opacity: 1;
}
48% {
transform: translateY(4.4px);
opacity: 1;
}
58%,
100% {
transform: translateY(4.4px);
opacity: 0;
}
}
@keyframes liBit {
0%,
18% {
transform: translateX(0);
opacity: 0;
}
32% {
opacity: 1;
}
70% {
transform: translateX(2.6px);
opacity: 1;
}
84%,
100% {
transform: translateX(3px);
opacity: 0;
}
}
@keyframes liCode {
0%,
12% {
opacity: 0;
}
30%,
82% {
opacity: 1;
}
96%,
100% {
opacity: 0;
}
}
@keyframes liCrt {
0%,
6% {
opacity: 0;
}
24%,
58% {
opacity: 1;
}
66% {
opacity: 0.2;
}
74%,
86% {
opacity: 1;
}
100% {
opacity: 0;
}
}
@keyframes liCur {
0%,
45% {
opacity: 1;
}
50%,
95% {
opacity: 0;
}
100% {
opacity: 1;
}
}
@keyframes liBranch {
0%,
6% {
transform: translate(0, 0);
opacity: 0;
}
14% {
opacity: 1;
}
50% {
transform: translate(6.2px, 6.5px);
opacity: 1;
}
84% {

opacity: 1;
}
94%,
100% {

opacity: 0;
}
}
@keyframes liSheetC {

}
30% {
opacity: 1;
}
72%,
88% {

opacity: 1;

100% {
transform: translateY(0);
opacity: 0;
}

@keyframes liPapyrus {

8% {

}
56%,
84% {

}
100% {
transform: scaleY(0.5);
}
}
@keyframes liRollDown {

8% {

56%,
84% {
transform: translateY(0);
}
100% {
transform: translateY(-6.9px);

BOTTOM corners (the old mid-right square is gone). Left = HD indicator,
right = write-protect tab (closed = private, open = public repo). */
.f-hd {
position: absolute;
left: 6px;
bottom: 5px;
width: 11px;
height: 11px;
border-radius: 2px;

box-shadow:
inset 0 1px 2px rgba(0, 0, 0, 0.85),

}
.f-hd::after {
content: "";
position: absolute;
inset: 2px 2px 3px;
border-radius: 1px;
background: rgba(255, 255, 255, 0.16);
}
.f-wp {
position: absolute;
right: 6px;
bottom: 5px;
width: 11px;
height: 11px;
border-radius: 2px;
background: #181b20;
box-shadow:
inset 0 1px 2px rgba(0, 0, 0, 0.85),
0 0 0 1px rgba(255, 255, 255, 0.14);
pointer-events: none;
}
.f-wp.open::after {
content: "";
position: absolute;
inset: 2px 2px 3px;
border-radius: 1px;
background: #c6cabf;
}

disks, not a second tray box. (The K f-hd/f-wp hide is gone: the ghost
disks now have real size, so the micro-windows sit inside the disk as
they do live and never linger in the shelf gap.) */
.view-ghost > .tray,
.view-ghost > .rack,
.view-ghost > .cabinet {
background: none;

box-shadow: none;

/* K: opaque plate behind the fly clone. Some shells are genuinely
semi-transparent (ABOUT.ME/PROJECTS, alpha .50/.42) — a live disk reads
solid because it composites over the dark screen, but a clone crossing a

AU.blip(1600, 0.03, 0.05);
apply();
});
});
apply();
})();
/* ============================== POWER WIRING ============================== */
/* J: robust power toggle. The button is small (32/40 px) and sits inside
#glass, whose own click handler powers things ON — on real phones a stray
hit or a double toggle read "off" as "off→on→off". So: toggle on
pointerup (primary, pointer still over the knob), the synthetic click is
swallowed, a second toggle <600 ms later is ignored, and nothing in the
same gesture may reach the glass. #debugpower logs every power event. */
var pwLast = 0,
pwLogEl = null;
function pwLog(msg) {
if (!pwLogEl) return;
pwLogEl.textContent += msg + "\n";
pwLogEl.scrollTop = pwLogEl.scrollHeight;
}
if (location.hash.indexOf("debugpower") >= 0) {
pwLogEl = document.createElement("div");
pwLogEl.style.cssText =
"position:fixed;top:8px;left:8px;z-index:9999;max-width:46vw;max-height:34vh;overflow:auto;" +
"background:rgba(0,0,0,.78);color:#7df2a2;font:11px/1.5 ui-monospace,Menlo,monospace;" +
"padding:6px 9px;white-space:pre;pointer-events:none;border:1px solid rgba(125,242,162,.4)";
document.body.appendChild(pwLogEl);
pwLog("power debug — each line: event, source, phase before→after");
}
function pwToggle(src) {
var now = Date.now();
if (now - pwLast < 600) return; /* debounce: a double toggle inside 600 ms is one press */
pwLast = now;
var before = S.phase;
if (S.phase === "off") powerOn({});
else powerOff();
pwLog(
"toggle " +
(before === "off" ? "ON" : "off") +
" [" +
src +
"] " +
(before === "off" ? "off" : "archive|boot") +
"→" +
S.phase
);
}
var pwBtn = $("powerBtn");
pwBtn.addEventListener("pointerup", function (e) {
if (e.pointerType === "mouse" && e.button !== 0) return; /* primary only */
var t = document.elementFromPoint(e.clientX, e.clientY); /* ::before counts as the knob */
if (t && !pwBtn.contains(t)) return; /* the pointer left the knob before release */
e.stopPropagation(); /* the glass must not see this gesture */
pwToggle(e.pointerType || "mouse");
});
pwBtn.addEventListener("click", function (e) {
e.stopPropagation(); /* ALWAYS: the glass's power-on/skip must never see a knob click */
if (Date.now() - pwLast < 600) return; /* the synthetic click after a handled pointerup */
pwToggle("click");
});
glass.addEventListener("click", function () {
if (S.phase === "off") {
if (S.warming) {
jumpWarm();
} else {
powerOn({});
}
} else if (S.phase === "boot" && !S.offing) skipBoot(); /* J: never skip into the off-collapse */
});
/* skip the dot->line->raster warm-up and go straight to BIOS */
function jumpWarm() {
bootReset(); /* kill powerOn's pending timers (startBios @520ms, warm.out @620ms) — else two BIOS chains */
S.warming = false;
warm.classList.add("out");
bootTimers.push(
setTimeout(function () {
warmReset();
}, 200)
);
glass.classList.add("on");
spillSet(true); /* v7 G2 (item 10): the raster was jumped — the spill comes up now */
startBios({});
}
/* ============================== HASH (test hooks) ============================== */
function parseHash() {
var h = { skip: false, path: null, open: null, hold: false };
var raw = location.hash.replace(/^#\/?/, "");
if (!raw) return h;
if (raw.indexOf("skip") === 0) h.skip = true;
raw.split("&").forEach(function (p) {
var kv = p.split("="),
k = kv[0],
v = kv[1] || "";
if (k === "path") h.path = decodeURIComponent(v).toUpperCase().split("/");
else if (k === "open") h.open = decodeURIComponent(v);
else if (k === "hold") h.hold = true;
else if (k === "skip") h.skip = true;
else if (k === "off") h.off = true;
else if (k === "shade") h.shade = v; /* v7 G1 (item 1): off-glass swatch 1|2|3 */
});
return h;
}
var hashes = parseHash();
/* v7 G1 (item 1): off-glass swatches — #off&shade=2|3 (1 is the default) */
if (hashes.shade === "2" || hashes.shade === "3") glass.classList.add("offshade-" + hashes.shade);
dragInit();
if (S.snd) {
sndBtn.textContent = "SND ON";
sndBtn.setAttribute("aria-pressed", "true");
}
/* ============================== STAGE (fixed size, uniform scale) ============== */
var DESK_W = 1680,
DESK_H = 1000,
PHONE_W = 430,
PHONE_H = 900;
var stageEl = $("stage");
function fitStage() {
/* phone stage: narrow AND portrait; everything else gets the desktop stage */
var phone = innerWidth < 600 && innerHeight > innerWidth;
document.body.classList.toggle("st-phone", phone);
var W = phone ? PHONE_W : DESK_W;
/* v6 E (#1 / O3): scale from the REAL content height (monitor + stand +
caption), never the nominal stage alone — when the content was taller
than 1000 px the monitor got cropped at the top and the caption went
off-screen at 1920x1080 / 2560x1440 */
var gap = parseFloat(getComputedStyle(stageEl).rowGap) || 16;
var mon = document.querySelector(".monitor"),
cap = document.getElementById("caption");
var content = (mon ? mon.offsetHeight : 0) + gap + (cap ? cap.offsetHeight : 0);
var H = Math.max(phone ? PHONE_H : DESK_H, content);
var s = Math.min(innerWidth / W, innerHeight / H) * 0.98; /* small breathing margin */
S.scale = s;
S.phone = phone;
/* J: the knob's hit area must stay ≥44 px on screen (phone) / ≥32 (desktop)
while the stage is scaled — the pseudo's inset grows with 1/s */
stageEl.style.setProperty(
"--pw-hit",
Math.max(2, ((phone ? 44 : 32) / s - (phone ? 40 : 32)) / 2).toFixed(1) + "px"
);
/* sharpness: CSS `zoom` where supported (Chromium, Firefox >=126) lets the
browser rasterize text at the zoomed size — crisper than transform:scale.
Fallback: the transform path (e.g. Safari). Same scale law either way. */
var canZoom = "zoom" in stageEl.style;
S.zoom = canZoom;
if (canZoom) {
/* the flex wrapper does the centring — never position the zoomed element */
stageEl.style.position = "static";
stageEl.style.left = stageEl.style.top = "";
stageEl.style.marginLeft = stageEl.style.marginTop = "";
stageEl.style.transform = "none";
stageEl.style.zoom = s;
} else {
stageEl.style.position = "absolute";
stageEl.style.left = "50%";
stageEl.style.top = "50%";
stageEl.style.marginLeft = stageEl.style.marginTop = "";
stageEl.style.zoom = "";
stageEl.style.transform = "translate(-50%,-50%) scale(" + s + ")";
}
}
/* ============================== BOOT STRAP ============================== */
purgeStoredLayouts(); /* O1: fresh on every load — drop any old archive5.layout.* keys */
fitStage();
window.addEventListener("load", function () {
fitStage();
});
buildCardEl();
if (document.fonts && document.fonts.ready) {
document.fonts.ready.then(function () {
if (S.phase === "archive") {
fitLabels();
applyLayout();
}
});
}
if (hashes.skip || hashes.path || hashes.open) {
led.classList.add("on");
caption.innerHTML = "<b>HARALAMBOS VARSAMIS</b> · TU7URU · ARCHIVE.SYS";
glass.classList.add("on");
spillSet(true); /* v7 G2 (item 10): hash boot skips the raster — the spill fades in straight away */
startArchive(true);
/* validate + set a (possibly nested) path, e.g. #path=PROJECTS/ACADEMIC.
v7 G3 (item 12): an unknown segment = "Not ready reading drive N:" in
the status bar for 3 s, then the shelf lands on the root.
review #2: the error always clears — after 3 s the shelf lands on root,
whether or not the user has already moved (only if the message is
still the one shown). Declared BEFORE the path block: a path-less hash
(#skip&open=nope) must be able to use it too. */
var driveErr = function (dr) {
var msg = "Not ready reading drive " + dr + ":";
setTimeout(function () {
statLeft.textContent = msg;
}, 80);
setTimeout(function () {
if (S.phase === "archive" && statLeft.textContent === msg) {
S.path = [];
render(true);
}
}, 3000);
};
if (hashes.path) {
var p = [],
node = null,
badDrive = null;
for (var pi = 0; pi < hashes.path.length; pi++) {
var seg = hashes.path[pi];
if (pi === 0) {
if (DATA[seg]) {
p.push(seg);
node = DATA[seg];
} else {
badDrive = "A";
break;
}
} else {
var nx = null;
for (var pj = 0; node && pj < node.items.length; pj++)
if (node.items[pj].id.toUpperCase() === seg) {
nx = node.items[pj];
break;
}
if (nx) {
p.push(nx.id);
node = nx;
} else {
badDrive = (p.length && DATA[p[0]] && DATA[p[0]].drive) || "A";
break;
}
}
}
S.path = p;
if (badDrive) driveErr(badDrive);
}
render(true);
if (hashes.open) {
var found = findEverywhere(hashes.open);
if (found) {
S.path = found.path.slice(0, -1);
render(true);
(function (fid) {
setTimeout(function () {
showCard(fid);
}, 60);
})(found.path[found.path.length - 1]);
} else driveErr("A");
/* review #2: an unknown &open item says so, the same way a bad drive does */
}
} else if (hashes.hold) {
led.classList.add("on");
caption.innerHTML = "<b>HARALAMBOS VARSAMIS</b> · TU7URU · ARCHIVE.SYS";
glass.classList.add("on");
spillSet(true); /* v7 G2 (item 10): the held BIOS still lights the tube */
setTimeout(function () {
startBios({ full: true });
}, 650);
} else {
/* stay off; wait for power */
}
/* v6 test hook (QA c01/c02): push a dummy item into a category and
re-render — a new entry must get a cell, default scene, colour and
card buttons with zero hand-wiring. Test-only; not part of the page. */
window.__addTestData = function (catId, item) {
var cat = DATA[catId];
if (!cat) return false;
cat.items.push(item);
render(true);
return true;
};
window.__archive = { DATA: DATA, CATS: CATS, SCHEMA: SCHEMA, SCENES: SCENES };
})();
</script>
